[project]
name = "ai-development-orchestrator"
version = "0.1.0"
description = "Orkestreert Claude en een reviewer over meerdere ontwikkelprojecten, zonder te gokken."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
# De kern draait zonder deze pakketten; ze zijn alleen nodig voor de
# reviewer-adapter. Zo blijven de tests overal draaien.
reviewer = ["openai>=1.0"]

[project.scripts]
orchestrator = "orchestrator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orchestrator*"]
